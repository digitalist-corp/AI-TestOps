name: Demo rehearsal

# 11/24 시연 리허설 (#88). 테스트 서버에서 시연 순서(docs/demo/시연-순서.md)를 시연용 PM 계정으로 그대로 누르며
# 단계별 화면을 아티팩트로 남기고, 끝나면 scripts/demo-reset.sh 로 원래 상태(실패 spec · 결함 1건)로 되돌린다.
# 수동 실행: gh workflow run demo-rehearsal.yml  (또는 Actions 화면에서 Run workflow)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "시연 주소 (비우면 README 의 배포 주소)"
        required: false
        default: ""

concurrency:
  group: demo-rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    runs-on: [self-hosted, playops-testserver]
    timeout-minutes: 25
    steps:
      - name: 시연 리허설
        env:
          BASE_INPUT: ${{ inputs.base_url }}
        run: |
          set +e -uo pipefail
          cd /home/playops/playops
          BASE=${BASE_INPUT:-$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' README.md | head -1)}
          IMAGE=$(docker images playops-runner --format '{{.Repository}}:{{.Tag}}' | grep -- '-pw1.53' | head -1)
          [ -n "$IMAGE" ] || { echo "::error::러너 이미지(playops-runner:*-pw1.53*)가 없습니다. 셀프 회귀 테스트가 한 번 돌아야 만들어집니다."; exit 1; }
          USER_NAME=$(grep -E '^DEMO_PM_USERNAME=' .env | cut -d= -f2- || true)
          PW=$(grep -E '^DEMO_PM_PASSWORD=' .env | cut -d= -f2- || true)
          [ -n "$PW" ] || { echo "::error::서버 .env 에 DEMO_PM_PASSWORD 가 없습니다 (배포가 한 번 돌면 만들어집니다)"; exit 1; }
          echo "::add-mask::$PW"
          SHOTS="$RUNNER_TEMP/demo-rehearsal"
          mkdir -p "$SHOTS"
          echo "시연 주소: $BASE · 이미지: $IMAGE"
          docker run --rm --add-host host.docker.internal:host-gateway \
            -e BASE_URL="$BASE" -e DEMO_PM_USERNAME="${USER_NAME:-demo-pm}" -e DEMO_PM_PASSWORD="$PW" -e SHOTS=/shots \
            -v "$PWD/playwright-projects/playops-self:/w" -v "$SHOTS:/shots" -w /w "$IMAGE" \
            npx playwright test tests/demo-rehearsal.spec.ts --project=chromium --reporter=list --output=/shots/test-output
          RESULT=$?
          # 컨테이너가 root 로 만든 파일을 러너가 올리고 지울 수 있게
          docker run --rm -v "$SHOTS:/shots" "$IMAGE" chown -R "$(id -u):$(id -g)" /shots
          echo "REHEARSAL_RESULT=$RESULT" >> "$GITHUB_ENV"

      - name: 단계별 화면 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-rehearsal
          path: ${{ runner.temp }}/demo-rehearsal

      - name: 원래 상태로 되돌리기
        if: always()
        run: |
          cd /home/playops/playops
          ./scripts/demo-reset.sh

      - name: 리허설 결과
        run: |
          [ "${REHEARSAL_RESULT:-1}" = 0 ] || { echo "::error::리허설이 끝까지 가지 못했습니다. 아티팩트의 단계별 화면과 test-output 을 보세요."; exit 1; }
          echo "리허설 통과"

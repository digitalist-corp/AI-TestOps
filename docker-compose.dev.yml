services:
  postgres:
    image: postgres:16-alpine
    container_name: playops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-playops}
      POSTGRES_USER: ${POSTGRES_USER:-playops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playops}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ./storage/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-playops} -d ${POSTGRES_DB:-playops}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: playops-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-playops}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-playops}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-playops}
      LOGIN_USERNAME: ${LOGIN_USERNAME:-admin}
      # 비었거나 admin 이면 관리자를 admin 으로 만들고 첫 로그인에 비밀번호를 바꾸게 한다 (최초 생성에만 씀)
      LOGIN_PASSWORD: ${LOGIN_PASSWORD:-}
      GUEST_USERNAME: ${GUEST_USERNAME:-guest}
      GUEST_PASSWORD: ${GUEST_PASSWORD:-}
      # 시연용 PM 계정 (시연 프로젝트 PM). 비밀번호가 비면 만들지 않는다
      DEMO_PM_USERNAME: ${DEMO_PM_USERNAME:-demo-pm}
      DEMO_PM_PASSWORD: ${DEMO_PM_PASSWORD:-}
      # 셀프 회귀(playops-self) 전용 관리자 계정. 비밀번호가 비면 만들지 않는다
      SELFTEST_USERNAME: ${SELFTEST_USERNAME:-selftest}
      SELFTEST_PASSWORD: ${SELFTEST_PASSWORD:-}
      PLAYOPS_PROJECTS_ROOT: /playwright-projects
      PLAYOPS_STORAGE_ROOT: /storage
      PLAYOPS_DOCKER_ENABLED: ${PLAYOPS_DOCKER_ENABLED:-true}
      PLAYOPS_ENCRYPTION_KEY: ${PLAYOPS_ENCRYPTION_KEY:-}
      WEB_PORT: ${WEB_PORT:-3000}
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: "true"
    ports:
      - "${API_PORT:-8080}:8080"
      - "${API_DEBUG_PORT:-5005}:5005"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - ./storage:/storage
      - ./playwright-projects:/playwright-projects
      - api-gradle-cache:/home/gradle/.gradle
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - sh
      - -c
      - gradle classes --continuous --no-daemon & gradle bootRun --no-daemon

  web:
    build:
      context: ./apps/web
    container_name: playops-web
    restart: unless-stopped
    environment:
      VITE_API_PROXY: http://api:8080
      VITE_PLAYOPS_ENV_FILE_PRESENT: ${PLAYOPS_ENV_FILE_PRESENT:-false}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
    command: ["sh", "-c", "npm install --no-package-lock && npm run dev"]

  worker:
    build:
      context: ./apps/worker
    container_name: playops-worker
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8080
      PROJECTS_ROOT: /playwright-projects
      NPM_CONFIG_CACHE: /storage/cache/npm/worker
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    depends_on:
      - api
    volumes:
      - ./playwright-projects:/playwright-projects
      - ./storage:/storage

  # LangGraph 학습 루프 (E-03). 프로파일 ai 로만 뜬다 — 기본 npm run dev · 배포 · 시연에는 없다.
  #   docker compose -f docker-compose.dev.yml --profile ai up -d ai-service
  # 체크포인트는 같은 postgres 의 스키마 langgraph. 호스트 포트는 열지 않는다(내부망 전용).
  ai-service:
    build:
      context: ./apps/ai-service
    container_name: playops-ai-service
    profiles: [ai]
    restart: unless-stopped
    environment:
      AI_SERVICE_DATABASE_URL: postgresql://${POSTGRES_USER:-playops}:${POSTGRES_PASSWORD:-playops}@postgres:5432/${POSTGRES_DB:-playops}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  api-gradle-cache:
  web-node-modules:

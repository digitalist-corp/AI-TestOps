<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 — 데모샵</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <!-- 상단 공통 헤더 -->
  <header class="site-header">
    <div class="container header-container">
      <a href="index.html" class="brand-logo" data-testid="brand-logo">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
        </div>
        <span>데모샵</span>
      </a>
      <nav aria-label="주요 내비게이션">
        <ul class="nav-menu">
          <li><a href="products.html" class="nav-link" data-testid="nav-products">상품</a></li>
          <li>
            <a href="cart.html" class="nav-link" data-testid="nav-cart">
              장바구니
              <span id="cart-badge" class="badge" data-testid="cart-badge">0</span>
            </a>
          </li>
        </ul>
      </nav>
      <div id="header-auth-area" class="header-auth" data-testid="header-auth">
        <a href="login.html" id="login-nav-link" class="nav-link active" data-testid="login-nav-link">로그인</a>
      </div>
    </div>
  </header>

  <!-- 메인 본문 -->
  <main>
    <div class="container">
      <div class="auth-wrapper">
        <div class="auth-card">
          <div class="auth-header">
            <h1 class="auth-title">로그인</h1>
            <p class="auth-desc">데모샵 서비스를 이용하시려면 로그인해 주세요.</p>
          </div>

          <div id="login-error" class="alert alert-danger" role="alert" style="display: none;" data-testid="login-error">
            아이디 또는 비밀번호가 올바르지 않습니다.
          </div>

          <form id="login-form" novalidate>
            <div class="form-group">
              <label for="username" class="form-label">아이디</label>
              <input type="text" 
                     id="username" 
                     name="username" 
                     class="form-input" 
                     placeholder="아이디를 입력하세요" 
                     autocomplete="username"
                     required 
                     data-testid="login-username">
            </div>

            <div class="form-group">
              <label for="password" class="form-label">비밀번호</label>
              <input type="password" 
                     id="password" 
                     name="password" 
                     class="form-input" 
                     placeholder="비밀번호를 입력하세요" 
                     autocomplete="current-password"
                     required 
                     data-testid="login-password">
            </div>

            <button type="submit" id="login-submit" class="btn btn-primary btn-block btn-lg" data-testid="login-submit">
              로그인
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- 하단 푸터 -->
  <footer class="site-footer">
    <div class="container">
      <p>© 2026 데모샵 (Demo Shop). AI-TestOps 사용자 가이드 테스트 사이트.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 목록 — 데모샵</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="products">
  <!-- 상단 공통 헤더 -->
  <header class="site-header">
    <div class="container header-container">
      <a href="index.html" class="brand-logo" data-testid="brand-logo">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
        </div>
        <span>데모샵</span>
      </a>
      <nav aria-label="주요 내비게이션">
        <ul class="nav-menu">
          <li><a href="products.html" class="nav-link active" data-testid="nav-products">상품</a></li>
          <li>
            <a href="cart.html" class="nav-link" data-testid="nav-cart">
              장바구니
              <span id="cart-badge" class="badge" data-testid="cart-badge">0</span>
            </a>
          </li>
        </ul>
      </nav>
      <div id="header-auth-area" class="header-auth" data-testid="header-auth">
        <!-- JS로 동적 렌더링 -->
        <a href="login.html" id="login-nav-link" class="nav-link" data-testid="login-nav-link">로그인</a>
      </div>
    </div>
  </header>

  <!-- 메인 본문 -->
  <main>
    <div class="container">
      <div class="section-header">
        <h1 class="section-title">상품 목록</h1>
        <p class="section-desc">데모샵이 준비한 고품질 디지털 기기를 둘러보세요.</p>
      </div>

      <!-- 검색 툴바 -->
      <div class="products-toolbar">
        <div class="search-box">
          <label for="product-search" class="sr-only">상품 검색</label>
          <span class="search-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </span>
          <input type="search" 
                 id="product-search" 
                 name="search" 
                 placeholder="상품명으로 검색..." 
                 data-testid="product-search-input">
        </div>
        <div id="products-count" class="products-count" data-testid="products-count">
          총 6개 상품
        </div>
      </div>

      <!-- 상품 카드 그리드 (JS로 렌더링) -->
      <section id="products-grid" class="products-grid" aria-label="상품 그리드" data-testid="products-grid">
        <!-- JS로 6개 상품 카드 주입 -->
      </section>
    </div>
  </main>

  <!-- 하단 푸터 -->
  <footer class="site-footer">
    <div class="container">
      <p>© 2026 데모샵 (Demo Shop). AI-TestOps 사용자 가이드 테스트 사이트.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>

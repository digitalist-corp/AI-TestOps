spring:
  application:
    name: playops-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

# AI 공급자 API 키는 관리자 설정(DB, 암호화 저장)에서만 관리한다. 여기에는 모델명만 둔다.
anthropic:
  model: ${ANTHROPIC_MODEL:claude-sonnet-5}

openai:
  model: ${OPENAI_MODEL:gpt-4o-mini}

# BEDROCK_MODEL_ID 를 채우면 Claude 호출이 api.anthropic.com 대신 Amazon Bedrock 으로 나간다.
# 자격증명은 AWS 기본 체인(AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)에서 읽는다.
bedrock:
  model: ${BEDROCK_MODEL_ID:}
  region: ${AWS_REGION:ap-northeast-2}

llm:
  # 이번 달 추정 비용이 이 값(USD)에 닿으면 AI 호출을 거부한다. 0 이면 제한하지 않는다.
  # 추정은 AI 설정 화면에 적은 단가로 계산하므로, 단가가 비어 있으면 동작하지 않는다.
  monthly-budget-usd: ${AI_MONTHLY_BUDGET_USD:0}

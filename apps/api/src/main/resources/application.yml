spring:
  application:
    name: playops-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

# AI 공급자 API 키는 관리자 설정(DB, 암호화 저장)에서만 관리한다. 여기에는 모델명만 둔다.
anthropic:
  model: ${ANTHROPIC_MODEL:claude-sonnet-5}

openai:
  model: ${OPENAI_MODEL:gpt-4o-mini}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/playops}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:playops}
    password: ${SPRING_DATASOURCE_PASSWORD:playops}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # 스키마는 Flyway 가 만든다. update 는 뷰(ai_ro)가 쓰는 열에 쓸데없는 ALTER 를 날려 시작이 깨지므로 운영과 같이 validate.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false

playops:
  projects-root: ${PLAYOPS_PROJECTS_ROOT:./playwright-projects}
  storage-root: ${PLAYOPS_STORAGE_ROOT:./storage}
  docker-enabled: ${PLAYOPS_DOCKER_ENABLED:true}
  security:
    encryption-key: ${PLAYOPS_ENCRYPTION_KEY:}

logging:
  level:
    com.playops: DEBUG
